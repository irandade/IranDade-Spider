[project]
name = "irandade-spider"
version = "0.1.0"
description = "Scrapy spider to crawl sites and download PDF/Excel files"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
spider = "irandade_spider.main:app"

[dependency-groups]
dev = [
    "scrapy>=2.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
